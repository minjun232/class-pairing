<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>자리배치</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 탭 (반 선택 화면에서는 숨김) -->
  <nav id="nav" hidden>
    <button class="nav-class" data-go="class" id="nav-classname">반</button>
    <!-- 준비: 명단·교실 / 진행: [자리 배치 시작] → 요청 → 배치 → 공개 → 확정 -->
    <div class="tabs">
      <button data-go="roster">명단</button>
      <button data-go="room">교실</button>
    </div>
    <button id="btn-start" class="primary nav-start">자리 배치 시작</button>
    <ol id="steps" class="steps" hidden>
      <li>요청</li><li>배치</li><li>공개</li><li>확정</li>
    </ol>
    <span id="model-status" class="model-status"></span>
    <button class="quit" data-action="quit" aria-label="끝내기">끝내기</button>
  </nav>

  <!-- ① 반 선택 -->
  <section id="screen-class" class="screen">
    <div class="class-box">
      <h1>자리배치</h1>
      <div id="class-list" class="class-list"></div>
      <div class="class-add">
        <input id="new-class" type="text" placeholder="새 반 이름 (예: 2-3)" maxlength="40">
        <button id="btn-add-class" class="secondary">반 추가</button>
      </div>
      <p id="class-msg" class="msg"></p>
      <button id="btn-open-class" class="primary big">시작</button>
    </div>
    <button class="quit corner" data-action="quit">끝내기</button>
    <span id="model-status-2" class="model-status corner-left"></span>
  </section>

  <!-- 명단 입력 -->
  <section id="screen-roster" class="screen" hidden>
    <p class="hint">한 줄에 한 명씩 적어 주세요. 엑셀이나 나이스에서 이름을 복사해 붙여 넣어도 돼요.</p>
    <div class="roster-cols">
      <label class="roster-col">
        <span class="label">남 <b id="count-m">0</b>명</span>
        <textarea id="roster-m" spellcheck="false"></textarea>
      </label>
      <label class="roster-col">
        <span class="label">여 <b id="count-f">0</b>명</span>
        <textarea id="roster-f" spellcheck="false"></textarea>
      </label>
    </div>
    <div class="bottom-bar">
      <p id="roster-msg" class="msg"></p>
      <button id="btn-save-roster" class="primary">저장</button>
      <button id="btn-roster-next" class="primary" hidden>교실 설정으로</button>
    </div>
  </section>

  <!-- ② 교실 설정 -->
  <section id="screen-room" class="screen" hidden>
    <div class="toolbar">
      <div class="group">
        <span class="label">배치</span>
        <div class="seg" id="preset">
          <button data-v="pair">짝</button>
          <button data-v="single">단독</button>
          <button data-v="group">모둠</button>
        </div>
        <div class="stepper" id="group-size-box">
          <button data-step="-1" aria-label="모둠 인원 줄이기">−</button>
          <span id="group-size">4</span>
          <button data-step="1" aria-label="모둠 인원 늘리기">+</button>
        </div>
      </div>
      <div class="group" id="gender-box">
        <span class="label">성별</span>
        <div class="seg" id="gender">
          <button data-v="any">무관</button>
          <button data-v="mixed" id="gender-mixed">남녀 짝</button>
        </div>
      </div>
      <div class="group">
        <span class="label">줄</span>
        <div class="stepper" id="rows-box">
          <button data-step="-1" aria-label="줄 줄이기">−</button>
          <span id="rows">5</span>
          <button data-step="1" aria-label="줄 늘리기">+</button>
        </div>
        <span class="label">열</span>
        <div class="stepper" id="cols-box">
          <button data-step="-1" aria-label="열 줄이기">−</button>
          <span id="cols">6</span>
          <button data-step="1" aria-label="열 늘리기">+</button>
        </div>
      </div>
      <span id="room-count" class="count"></span>
      <button id="btn-room-prev" class="secondary" hidden>현재 배치 보기</button>
    </div>
    <p id="room-msg" class="msg warn"></p>
    <div class="room-wrap">
      <!-- 창문·문은 화면 끝이 아니라 자리 바로 옆에 붙인다 -->
      <div class="room-center fit-host">
        <div class="room-box">
          <div class="front-row"><span class="podium">교탁</span><span class="board">칠판</span></div>
          <div class="side left">창문</div>
          <div id="room-grid" class="grid editable"></div>
          <div class="side right"><span class="door">앞문</span><span class="door">뒷문</span></div>
        </div>
      </div>
    </div>
    <p class="hint">칸을 누르면 자리 → 빈자리 → 통로 순서로 바뀌어요.</p>
  </section>

  <!-- ③ 학생 요청 -->
  <section id="screen-req" class="screen" hidden>
    <p class="hint">학생 요청이 있으면 이름 옆에 적어 주세요. 없으면 바로 [자리 배치]를 누르세요.</p>
    <p id="req-msg" class="msg warn"></p>
    <div id="req-list" class="req-list"></div>
    <div class="bottom-bar">
      <button id="btn-req-back" class="secondary">이전</button>
      <span id="req-saved" class="saved"></span>
      <button id="btn-save-req" class="secondary">저장</button>
      <button id="btn-req-next" class="primary big">자리 배치</button>
    </div>
  </section>

  <!-- ④ 자리 배치와 공개 -->
  <section id="screen-seat" class="screen" hidden>
    <div class="seat-main">
      <div class="seat-room">
        <p id="seat-caption" class="seat-caption" hidden></p>
        <div class="board-bar">칠판</div>
        <div id="seat-grid" class="grid"></div>
      </div>
      <aside id="name-list" class="name-list" hidden></aside>
    </div>
    <div class="bottom-bar">
      <p id="seat-msg" class="msg"></p>
      <button id="btn-show-prev" class="secondary" hidden>현재 배치 보기</button>
      <button id="btn-arrange" class="primary big">자리 배치</button>
      <!-- 배치 후 버튼은 자리를 고정한다 (보이기만 바꿈). 전체 공개와 편집은 같은 자리를 번갈아 쓴다 -->
      <button id="btn-edit-req" class="secondary" hidden>요청 수정</button>
      <button id="btn-rearrange" class="secondary" hidden>다시 배치</button>
      <span id="slot-reveal-edit" class="slot" hidden>
        <button id="btn-reveal-all" class="secondary">전체 공개</button>
        <button id="btn-edit" class="secondary">편집</button>
      </span>
      <button id="btn-word" class="primary" hidden>Word로 저장</button>
    </div>
  </section>

  <!-- 확인 창 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <div id="modal-text" class="modal-text"></div>
      <div class="modal-buttons">
        <button id="modal-cancel" class="secondary">취소</button>
        <button id="modal-ok" class="primary">확인</button>
      </div>
    </div>
  </div>

  <!-- 알림 -->
  <div id="toast" class="toast" hidden>
    <span id="toast-text"></span>
    <button id="toast-action" class="link" hidden>폴더 열기</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
