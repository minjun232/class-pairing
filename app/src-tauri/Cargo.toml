[package]
name = "jaribaechi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "자리배치 — 프롬프트형 자리 배치 프로그램"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
seat-core = { path = "../../crates/seat-core" }
seat-interpret = { path = "../../crates/seat-interpret" }
seat-storage = { path = "../../crates/seat-storage" }
seat-llm = { path = "../../crates/seat-llm", optional = true }
tauri = { version = "2", features = ["custom-protocol"] }
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
default = ["llm"]
# 내장 LLM(llama.cpp). 끄면 모델 없이 화면·배치만 확인할 수 있다(개발용).
llm = ["dep:seat-llm"]

[dev-dependencies]
tempfile = "3"
