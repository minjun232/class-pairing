name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 공개 저장소: 워크플로는 코드 읽기 권한만 가진다
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 테스트 (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri 빌드에 필요한 패키지
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 테스트
        run: cargo test --workspace --release
      - name: 교사 조건 위반 0건 확인 (3000회)
        run: cargo test --release -p seat-core -- --ignored

